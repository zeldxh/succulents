spring.application.name=practica01

# Carga variables desde .env en la raíz del proyecto (si existe)
spring.config.import=optional:file:.env[.properties]

# Se define el puerto por el que escucha el servidor web (requerido: 91).
server.port=91

# Se evita el uso de cache en desarrollo.
spring.thymeleaf.cache=false

# Conexión local a la base de datos practica en MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/practica}
spring.datasource.username=${DB_USERNAME:usuario_practica}
spring.datasource.password=${DB_PASSWORD}

# Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Bitácora (logging) ---
# Nivel TRACE para los mensajes de consola.
logging.level.root=trace
# Formato de fecha del log: día del mes, hora y minuto.
logging.pattern.dateformat=dd HH:mm
# Mostrar el SQL generado por Hibernate de forma legible.
spring.jpa.properties.hibernate.format_sql=true

# --- Firebase Storage (almacenamiento de imágenes en la nube) ---
firebase.bucket.name=${FIREBASE_BUCKET_NAME:techshop-1337.firebasestorage.app}
firebase.storage.path=${FIREBASE_STORAGE_PATH:suculentas}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH}

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

    <!-- Fragmento head: incluye Bootstrap, Font-Awesome, jQuery y rutinas propias. -->
    <head th:fragment="head">
        <title>[[#{aplicacion.titulo}]]</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
        <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
        <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
        <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
        <script th:src="@{/js/rutinas.js}"></script>
    </head>

    <!-- Fragmento header: menú de navegación del dominio suculentas. -->
    <header th:fragment="header" class="header">
        <nav class="navbar navbar-expand-sm p-0">
            <div class="container">
                <a th:href="@{/}" class="navbar-brand">[[#{aplicacion.titulo}]]</a>
                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav">
                        <li class="nav-item px-2"><a class="nav-link" th:href="@{/}">[[#{plantilla.inicio}]]</a></li>
                        <li class="nav-item px-2"><a class="nav-link" th:href="@{/suculenta/listado}">[[#{plantilla.suculentas}]]</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        <section id="main-header" class="py-2 bg-success text-white">
            <div class="container">
                <div class="row">
                    <div class="col-md-6">
                        <h1><i class="fas fa-seedling"></i> [[#{plantilla.lema}]]</h1>
                    </div>
                </div>
            </div>
        </section>
    </header>

    <!-- Fragmento footer: pie de página. -->
    <footer th:fragment="footer" class="p-2 mt-5 bg-info text-white">
        <p class="lead text-center">[[#{plantilla.derechos}]] &COPY;</p>
    </footer>

    <!-- Fragmento mostrarToast: ventana emergente para mensajes al usuario. -->
    <section th:fragment="mostrarToast">
        <div aria-live="polite" aria-atomic="true"
             class="position-fixed top-50 start-50 translate-middle" style="z-index: 1080;">
            <div th:if="${error}" class="toast show" role="alert" aria-live="assertive"
                 aria-atomic="true" data-bs-autohide="true">
                <div class="toast-header text-white bg-danger">
                    <i class="fa-solid fa-bomb"></i> <strong class="me-auto"> [[#{error}]]</strong>
                </div>
                <div class="toast-body">
                    <p>[[${error}]]</p>
                    <div class="mt-2 pt-2 border-top text-center">
                        <button type="button" class="btn btn-secondary btn-sm"
                                data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                    </div>
                </div>
            </div>
            <div th:if="${todoOk}" class="toast show" role="status" aria-live="polite"
                 aria-atomic="true" data-bs-autohide="true">
                <div class="toast-header text-white bg-success">
                    <i class="fa-solid fa-square-check"></i> <strong class="me-auto"> [[#{atencion}]]</strong>
                </div>
                <div class="toast-body">
                    <p>[[${todoOk}]]</p>
                    <div class="mt-2 pt-2 border-top text-center">
                        <button type="button" class="btn btn-secondary btn-sm"
                                data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

</html>
